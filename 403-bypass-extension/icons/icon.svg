<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <defs>
    <style>
      .navy{fill:none;stroke:#12275c;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;}
      .navyf{fill:#12275c;}
      .cyan{fill:#4ab8f0;}
      .pink{fill:#ee2a7b;}
      .white{fill:#ffffff;}
    </style>
  </defs>

  <!-- soft background blob -->
  <ellipse cx="62" cy="66" rx="54" ry="48" fill="#dcecfb"/>

  <!-- bypass arrow (behind window), cyan with navy outline, sweeping to the right -->
  <path d="M86 74 C104 70 100 96 88 96 C112 100 110 58 104 50"
        fill="none" stroke="#12275c" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M86 74 C104 70 100 96 88 96 C112 100 110 58 104 50"
        fill="none" stroke="#4ab8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrowhead -->
  <path d="M94 50 L110 43 L104 62 Z" class="navyf"/>
  <path d="M96.5 51.5 L107 46.8 L102.8 59 Z" class="cyan"/>

  <!-- pink dashed loop on the left -->
  <path d="M40 40 C10 46 12 92 44 96" fill="none" stroke="#ee2a7b" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- browser window -->
  <rect x="20" y="30" width="72" height="56" rx="6" class="white" stroke="#12275c" stroke-width="4.2"/>
  <!-- title bar -->
  <path d="M20 42 L20 36 A6 6 0 0 1 26 30 L86 30 A6 6 0 0 1 92 36 L92 42 Z" class="cyan"/>
  <line x1="20" y1="42" x2="92" y2="42" stroke="#12275c" stroke-width="4.2"/>
  <circle cx="30" cy="36" r="2.2" class="navyf"/>
  <circle cx="39" cy="36" r="2.2" class="navyf"/>
  <circle cx="48" cy="36" r="2.2" class="navyf"/>

  <!-- 403 text -->
  <text x="55" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="27" class="navyf">403</text>
  <!-- pink underline -->
  <rect x="34" y="74" width="42" height="4.5" rx="2.2" class="pink"/>

  <!-- pink X circle -->
  <circle cx="47" cy="92" r="10" class="pink"/>
  <path d="M43 88 L51 96 M51 88 L43 96" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- shield with padlock, bottom-right -->
  <path d="M78 68 L98 68 L98 84 C98 96 88 102 88 102 C88 102 78 96 78 84 Z"
        class="cyan" stroke="#12275c" stroke-width="4.2" stroke-linejoin="round"/>
  <rect x="83" y="84" width="10" height="9" rx="1.6" class="white"/>
  <path d="M84.5 84 L84.5 81 A3.5 3.5 0 0 1 91.5 81 L91.5 84" fill="none" stroke="#ffffff" stroke-width="2.4"/>
  <circle cx="88" cy="88" r="1.6" class="navyf"/>
</svg>
